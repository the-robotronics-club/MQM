version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mess_redis_local
    ports:
      - "6379:6379"
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7-alpine
    container_name: mess_influxdb_local
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=mess-monitor
      - DOCKER_INFLUXDB_INIT_BUCKET=camera_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-dev-token
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  influxdb_data: