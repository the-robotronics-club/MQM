[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#2563EB"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
codeTextColor = "#0F172A"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["34px", "28px", "22px", "18px", "15px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = true
chartCategoricalColors = ["#2563EB", "#16A34A", "#D97706", "#DC2626", "#8B5CF6", "#06B6D4", "#64748B"]

grayColor = "#64748B"
blueColor = "#2563EB"
greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#EA580C"
violetColor = "#8B5CF6"

dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#2563EB"
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeBorderColor = "#E2E8F0"
